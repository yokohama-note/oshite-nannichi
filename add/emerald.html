<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10b981"><title>エメラルドグリーンのアイコンを追加｜推して何日？</title><link rel="manifest" href="../manifests/emerald.webmanifest"><link rel="apple-touch-icon" href="../icons/emerald-192.png"><style>body{font-family:system-ui,-apple-system,'Yu Gothic',sans-serif;background:#d1fae5;color:#03382b;margin:0;padding:24px;line-height:1.7}main{max-width:560px;margin:auto;background:#fff;padding:24px;border:3px solid #03382b;border-radius:24px}img{width:144px;display:block;margin:auto}a{display:block;background:#10b981;color:#03382b;border:3px solid #03382b;padding:14px;text-align:center;border-radius:14px;font-weight:bold;text-decoration:none}li{margin:.8em 0}.note{background:#d1fae5;padding:12px;border-radius:12px}</style></head><body><main><img src="../icons/emerald-192.png" alt="エメラルドグリーンの推して何日？アイコン"><h1>エメラルドグリーンのアイコンで追加</h1><h2>iPhone / iPad</h2><ol><li>Safariでこのページを開く</li><li>共有ボタンを押す</li><li>「ホーム画面に追加」を押す</li></ol><h2>Android</h2><ol><li>Chromeのメニューを開く</li><li>「アプリをインストール」または「ホーム画面に追加」を押す</li></ol><p class="note">色を変えるときは、今のホーム画面の入口を削除し、新しい色のページから追加し直してください。入口を削除しても、アプリ内の名前・写真・予定は消えません。「保存データをすべて削除」とは別の操作です。端末やブラウザによって表示名が少し違うことがあります。</p><a href="../index.html">アプリにもどる</a></main></body></html>
